<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My Websites</title>
    <link rel="stylesheet" href="style.css">

    </style>
</head>

<body>
    <h1 > Registration Form </h1>
    <form method="post" action="submit.php">
        <input type="text" name="name" placeholder="Enter your name"><br><br>
        <input type="email" name="email" placeholder="Enter your email"><br><br>
        <input type="password" name="password" placeholder="Enter your password"><br><br>
        <input type="number" name="age" placeholder="Enter your age"><br><br>
        <input type="date" name="dob" placeholder="Enter your date of birth"><br><br>
        <input type="tel" name="phone" placeholder="Enter your phone number"><br><br>
        <input type="url" name="website" placeholder="Enter your website"><br><br>
        <input type="checkbox" name="subscribe" value="subscribe"> Subscribe to newsletter<br><br>
        <input type="radio" name="gender" value="male"> Male<br>
        <input type="radio" name="gender" value="female"> Female<br><br>
        <select name="country">
            <option value="usa">USA</option>
            <option value="uk">UK</option>
            <option value="canada">Canada</option>
            <option value="australia">Australia</option>
        </select><br><br>
        <textarea name="message" placeholder="Enter your message"></textarea><br><br>
        <a href="https://www.google.com" target="_blank">Visit Google</a><br><br>
        <p>Click the button below to submit the form:</p>

        <input type="submit" value="Submit">
    </form>
</body>

</html>
