<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
         .box {
            width: 10px;
            height: 10px;
            background-color: blue;
            margin: 20px;
            padding: 20vh;
            position: sticky;
         }
        .box2 {
            position: relative;
            top: 20px;
            left: 20px;
            background-color: red;
        }   
        .box3 {
                position: absolute;
                top: 20px;
                left: 20px;
                background-color: green;
            }   
        .box4 {
                position:relative;
                top: 20px;
                left: 20px;
                background-color: yellow;
            }
    </style>
</head>
<body>
    <div class="box box"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>    
    <div class="box box4"></div>
</body>
</html>
