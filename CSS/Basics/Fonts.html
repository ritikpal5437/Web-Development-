<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts Family</title>
    <style>
        h1 {
            font-family: Arial, sans-serif;
            font-size: 24px;
            color: #333;
        }

        p {
            font-family: 'lucida sans', sans-serif;
            font-size: 16px;
            color: #666;
            font-style: italic;
            font-weight: bold;
            font-variant: small-caps;
            font-decoration: underline;
        }
    </style>`
</head>
<body>
    <div>
        <h1>
            Fonts Family
            <p>This is a simple paragraph to demonstrate font styling.</p>
        </h1>
    </div>
    
</body>
</html>
