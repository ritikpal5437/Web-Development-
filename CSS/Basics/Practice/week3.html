<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Typo</title>
    <style>
        .hero{
            background: linear-gradient(to top, black, transparent);
             background-size: cover;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHKAVYInXIzewxILOrrEcWDjs1dEo5MjzM6zV9jH9epA&s=10);
           color: white;
            height: 80vh;
            width: 100%;
            padding: 40px;
            /* border: 2px solid black;
            border-radius: 15px; */
        }
        .content{
            position: relative;
            
        }
         .button {
       display: flex;
       gap: 10px;
   }
   .row{
    display: flex;
    overflow-x: scroll;
    gap: 10px;
}
.row img {
    width: 150px;
    height: 200px;
    object-fit: cover;
    flex-shrink: 0;
    transition: transform 0.3s ease;


   }
   .row img:hover {
    transform: scale(1.1);
    </style>
</head>
<body>
    <div class="hero">
        <div class="content">
        <h1>Netflix</h1>
        <p>Watch your favorite movies and TV shows online.</p>
        <div class="button">

        </div>
    </div>
