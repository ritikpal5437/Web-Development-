<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <style>
        .container {
            display: flex;
            
            align-items: center;
            height: 100vh;
            padding: 0 20px;
            gap: 10px;

        }

        .box{
            background-color: skyblue;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
        <div class="box">D</div>
    </div>
</html>
