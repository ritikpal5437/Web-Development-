<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        .card{
            width: 300px;
            
            border: 2px solid black;
            background-color: grey;
            text-align: center;
            margin: 50px auto;
            padding: 20px;
            box-shadow: 5px 5px 10px gray;
            border-radius: 15px;
        }
        h1{
            font-size: 30px;
            color: darkblue;
        }
        p{
            font-size: 18px;
            color: white;
        }
        button{
           
            background-color: blue;
            color: white;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            padding: 10px 20px;
            
        }
    </style>
</head>
<body>
    <div class = "card">  
        <h1>Ritik Pal</h1>
        <p>Web Developer</p>
        <button>Follow</button>
    </div>

    
</body>
</html>
