<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Grid</title>
    <style>
        .images{
            display: grid;
            grid-template-columns: 2fr 2fr 2fr 2fr;
            gap: 10px;

        }
        .images img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="images">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQiKwpNZ9ohmLenvGCgNp-Vf7RdoTE9zEfIUs6mgMaXhQ&s=10" alt="img" class="src">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDaJSPx44ndXVv2WoGJDJEXLrE3OmnpE5o7qtJezlCpA&s=10" alt="img" class="src">
        <img src="https://res.cloudinary.com/worldpackers/image/upload/c_limit,f_auto,q_auto,w_1140/s54r5baavahllbofupxa" alt="img" class="src">
   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRE6srRxZv59_Zn68Sl9LHO09UYf-p4CugHt3xH3HjvhQ&s=10" alt="img" class="src">
   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4TQFZwppx_f46q9Ij0l23KKwBJBbn3XZ5HQlGR0-m1tdwKQdbElX5wakn&s=10" alt="img" class="src">
   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4TQFZwppx_f46q9Ij0l23KKwBJBbn3XZ5HQlGR0-m1tdwKQdbElX5wakn&s=10" alt="img" class="src">
    </div>
    
</body>
</html>
