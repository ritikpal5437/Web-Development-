<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex grow</title>
    <style>
        .container {
            display: flex;
            /* flex-wrap: wrap;  */
            height: 300px;
            width: 900px;

        }

        .box {
            display: flex;
            height: 140px;
            width: 140px;
            border: 2px solid black;
            border-radius: 2px;
            background-color: aquamarine;
            justify-content: center;
            align-items: center;


        }

        .box1 {
            flex-grow: 7;
        }

        .box2 {
            flex-grow: 1;
        }

        .box3 {
            flex-grow: 1;
        }

        .box4 {
            flex-grow: 1;
        }

        .box5 {
            flex-grow: 1;
        }
    </style>
</head>


<body>
    <div class="container">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
        <div class="box box5">5</div>
    </div>

</body>

</html>
