<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        .profilecard{
            width: 300px;
            background-color: beige;
            padding: 20px;
            border: 2px solid black;
            border-radius: 15px;
            text-align: center;
        }
        .profilecard img{
            border-radius: 170%;
        object-fit: cover;
        height: 300px;
        }
        .buttons{
            display: flex;
        }
    </style>
</head>
<body>
    <div class="profilecard">
       <img src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8cGVyc29ufGVufDB8fDB8fA%3D%3D&auto=format&fit=crop&w=500&q=60" alt="Profile Image">
       <h2> Ritik</h2>
         <p>Web Developer</p>
         <div class="buttons">
         <button>Follow</button>
         <button>Message</button>
         </div>
    </div>
    
</body>
</html>
