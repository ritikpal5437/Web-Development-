<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify Content</title>
    <style>
        .container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 20vh;
            padding: 0 0px;
            gap: 10px;
            border: 2px solid black;

        }

        .box{
            background-color: skyblue;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            
            border: 2px solid black;
        }

    </style>
</head>
<body>
    <div class = "container">
        <div class = "box">A</div>
        <div class = "box">B</div>
        <div class = "box">C</div>
        <div class = "box">D</div>
</body>
</html>
