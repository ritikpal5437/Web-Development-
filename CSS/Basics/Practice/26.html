<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
      body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      } 
      .box{
        width: 120px ;
        height: 120px;
          background:orange;

    animation:rotate 2s infinite linear;
}
.scale{
     width: 120px ;
        height: 120px;
          background:orange;

    animation:scale 2s infinite ;


}
.bounce{
     width: 120px ;
        height: 120px;
          background:orange;

    animation:bounce 2s infinite ;
}


@keyframes rotate{

    0%{
        transform:rotate(0);
    }

    50%{
        transform:rotate(120deg);
    }

    100%{
        transform:rotate(360deg);
    }
}


@keyframes bounce{

     0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-80px);
    }

    100%{
        transform:translateY(0);
    }


}


@keyframes scale{

    0%{
        transform:scale(0);
    }

    50%{
        transform:scale(1.3);
    }

    100%{
        transform:scale(0);
    }

}
    </style>
</head>
<body>
    <div class="box"> Rotate  </div>
     <div class="box bounce"> bounce  </div>
      <div class="box scale"> scale </div>
    
</body>
</html>
