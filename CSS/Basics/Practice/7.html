<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homepage</title>
    <style>
        *{
            margin:0 0;
            box-sizing: border-box;
        }
        
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f2f2f2;
            padding: 15px 30px;
            
        }

        .logo {

            display: flex;
            color :rgb(16, 8, 8);
            font-size:24px;
            font-weight: bold;
            

            
        }

        .nav-links {
            display: flex;
            
            gap: 20px;
        }
  .nav-links{
    display:flex;
    gap:20px;
}
  .nav-links a{
    text-decoration:none;
    color:rgb(23, 1, 1);
}

.nav-links a:hover{
    color:orange;
}

.box{
    height:80vh;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:20px;
}

.box h1{
    font-size:45px;
}

.hero p{
    font-size:20px;
}

button{
    background:green;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:darkgreen;
}
</style>
</head>
<body>
<div class="navbar">

    <div class="logo">
        Logo
    </div>

    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>

</div>

<div class="box">

    <h1>Welcome</h1>

    <p>Learn HTML & CSS</p>

    <button>Get Started</button>

</div>

</body>
</html>
