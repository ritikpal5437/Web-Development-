<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Que 3 CSS</title>
    <style>
        .container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .card{
             width: 200px;
            border: 4px solid black;
            background: lightgreen;
            text-align: center;
            margin: 40px auto;
            padding: 20px;
            box-shadow: 5px 5px 10px gray;
            border-radius: 10px;
        } 
    </style>
</head>
<body>
   <div class="container">

    <div class="card">
        <h2>HTML</h2>
        <p>Structure of Web</p>
        <button>Learn</button>
    </div>

    <div class="card">
        <h2>CSS</h2>
        <p>Style of Web</p>
        <button>Learn</button>
    </div>

    <div class="card">
        <h2>JavaScript</h2>
        <p>Logic of Web</p>
        <button>Learn</button>
    </div>

</div>
    
</body>
</html>
