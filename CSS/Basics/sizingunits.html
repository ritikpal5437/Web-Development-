<head>

        .box {

            padding: 20vh;
            
            border: 5px solid black;
        }

<!-- learning about the units and sizing in css. CSS provides various units for specifying lengths, sizes, and dimensions of elements on a web page. These units can be broadly categorized into absolute units (such as pixels, points, and inches) and relative units (such as percentages, ems, rems, and viewport units). Understanding how to use these units effectively is crucial for creating responsive and visually appealing web designs that adapt to different screen sizes and devices. -->
