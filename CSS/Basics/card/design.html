
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design the Card</title>
    <style>
        body {
            
            background-color: rgb(233, 209, 209);
          
        .card {
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 200px;
            height: 300px;
            margin: 20px auto;
           
        }

        .card-header {
            background-color: #674df6;
            padding: 16px;
            text-align: center;
        }

        .card-body {
            padding: 16px;
        }

        .card-footer {
            background-color: #bee33b;
            padding: 16px;
            text-align: center;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="card"  height: 300px;
        width: 400px;>
        <div class ="card-image">
            <img src="https://images.unsplash.com/photo-1682685790910-1e3f5c7b8d2e?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1170&q=80" alt="Card Image" style="width: 100%; height: auto;">

        </div>
        
       
        
        <div class="card-header">
            <h2>WELCOME</h2>
        </div>
        <div class="card-body">
            <p>This is the content of the card. You can add text, images, or any other elements <here class="LOREM">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</here></p>
        </div>
        <div class="card-footer">
            <button>Read More</button>
        </div>
    
</body>
</html>
